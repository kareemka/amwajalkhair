<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: "Tahoma", sans-serif;
            padding: 10px;
            margin: 0;
            font-size: 14px;
        }

        .title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .section {
            margin-bottom: 6px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        img.qr {
            width: 90px;
            margin: 10px auto;
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="title">وصل مصروف</div>

    <div class="section">
        <div class="row">
            <span>رقم السجل:</span>
            <span>{{id}}</span>
        </div>

        <div class="row">
            <span>الموظف:</span>
            <span>{{employeeName}}</span>
        </div>

        <div class="row">
            <span>اسم المستخدم:</span>
            <span>{{username}}</span>
        </div>

        <div class="row">
            <span>المبلغ:</span>
            <span>{{formatNumber amount}}</span>
        </div>

        <div class="row">
            <span>نوع العملية:</span>
            <span>{{type}}</span>
        </div>

        <div class="row">
            <span>طريقة التحويل:</span>
            <span>{{transferType}}</span>
        </div>

        <div class="row">
            <span>التاريخ:</span>
            <span>{{createdAt}}</span>
        </div>
    </div>

    <img class="qr" src="{{qrCodeDataURL}}" />

    <div class="footer">
        تم الإنشاء بواسطة نظام Havana
    </div>

</body>

</html>
